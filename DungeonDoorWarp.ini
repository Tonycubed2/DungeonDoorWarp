; Dungeon Door Warp settings
; Goes in Data\SKSE\Plugins\DungeonDoorWarp.ini
;
; Key codes (SKSE / SkyUI convention):
;   keyboard = DirectX scan code, e.g. 199 = Home, 207 = End, 210 = Insert, 42 = Left Shift, 29 = Left Ctrl, 56 = Left Alt
;   mouse    = 256 + button: 256 = left click, 257 = right click, 258 = middle click
;   0        = off / none

[General]
; 1 = only in dungeons (location has one of the keywords below), 0 = any interior
DungeonsOnly=1
DungeonKeywords=LocTypeDungeon,LocTypeClearable,LocTypeDraugrCrypt,LocTypeDwarvenAutomatons,LocTypeFalmerHive,LocTypeVampireLair,LocTypeWarlockLair,LocTypeAnimalDen,LocTypeBanditCamp,LocTypeForswornCamp,LocTypeHagravenNest,LocTypeDragonPriestLair,LocTypeMine
; When to refuse a warp because of combat:
;   0 = never
;   1 = only while a live enemy close by (CombatRadius) is actually fighting you (default)
;   2 = while any loaded enemy, anywhere, is fighting you
BlockInCombat=1
; Distance (game units) for BlockInCombat=1
CombatRadius=3000
; 1 = show messages on screen
Notifications=1
; 1 = detailed log (map markers on every click, doors reached, companions moved). Use this for testing.
DebugLog=0

[MapWarp]
Enabled=1
; Click a door on the local map with this button to warp next to it
Button=256
; Optional key that must be held while clicking (0 = none, 42 = Left Shift)
Modifier=0
; Which doors you may warp to:
;   1 = doors you have walked up to
;   2 = doors leading to a level you have already been in
;   3 = either (default)
VisitRule=3
; How close (game units) you must get to a door for it to count as reached
DoorReachRadius=600
; How the plugin tells the local map from the world map:
;   1 = engine flag (default), 2 = the map movie's visibility, 0 = no check
LocalMapCheck=1

[EntranceHotkey]
Enabled=1
; Teleports you back inside the dungeon's first door, from any level (82 = Numpad 0)
Hotkey=82
; Optional key that must be held (0 = none)
Modifier=0
; 1 = press twice to confirm, so a stray key press doesn't undo your progress
Confirm=1
ConfirmSeconds=3

[Followers]
; Bring followers along (player teammates and CurrentFollowerFaction members: works with multiple-follower setups)
MoveFollowers=1
; Bring your summons along
MoveSummons=1
; Leave followers you told to wait
SkipWaitingFollowers=1
; 0 = every follower on your current level comes along; a number limits it to that distance (game units)
GatherRadius=0
; How far in front of you companions are placed
Offset=96
